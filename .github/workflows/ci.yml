---
name: "CI Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docker:
    name: Linting (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Run lint gates (same as local --lints-only)
        run: |
          set -euo pipefail
          mkdir -p reports/distro-logs
          ./scripts/build-and-test.sh --lints-only

      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-docker-log
          path: reports/distro-logs/
          if-no-files-found: warn

  coverage-gate:
    name: Coverage Gate (debian:trixie)
    needs: lint-docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Run coverage gate (same as local --coverage-only)
        run: |
          set -euo pipefail
          mkdir -p reports/distro-logs
          ./scripts/build-and-test.sh --coverage-only

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-gate
          path: |
            coverage/
            reports/distro-logs/coverage-gate.log
          include-hidden-files: true
          if-no-files-found: warn

  distro-tests:
    name: Distro (${{ matrix.image }})
    needs: [lint-docker, coverage-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:trixie
          - ubuntu:26.04
          - fedora:44
          - rocky:9
          - archlinux:latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Set matrix log slug
        run: |
          set -euo pipefail
          log_slug="${{ matrix.image }}"
          log_slug="${log_slug//\//-}"
          log_slug="${log_slug//:/-}"
          echo "log_slug=${log_slug}" >> "$GITHUB_ENV"

      - name: Compat then e2e (same as local --distro)
        run: |
          set -euo pipefail
          mkdir -p reports/distro-logs
          ./scripts/build-and-test.sh --distro "${{ matrix.image }}"

      - name: Upload distro logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distro-${{ env.log_slug }}
          path: reports/distro-logs/
          if-no-files-found: warn
