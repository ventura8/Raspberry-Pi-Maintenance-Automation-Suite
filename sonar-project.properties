# SonarQube Cloud configuration
# Docs: https://docs.sonarsource.com/sonarqube-cloud/

sonar.organization=ventura8
sonar.projectKey=ventura8_Raspberry-Pi-Maintenance-Automation-Suite
sonar.projectName=Raspberry-Pi-Maintenance-Automation-Suite

sonar.sources=.
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Build/CI output, generated reports and binary assets carry no analyzable source.
sonar.exclusions=\
  tests/**,\
  coverage/**,\
  reports/**,\
  .cache/**,\
  assets/**,\
  docs/**/*.png,\
  **/*.svg

# Sonar analyses these as test code (shell rules still apply, but they are
# excluded from the main-code quality gate).
sonar.test.inclusions=tests/**

# Line coverage from the kcov coverage gate. Sonar has no native Bash coverage
# importer, so tests/transform_coverage.py re-emits the merged Cobertura report
# in Sonar's generic format. Only CI-based analysis (the `sonarqube` job in
# .github/workflows/ci.yml) imports it -- Automatic Analysis never reads
# coverage reports.
sonar.coverageReportPaths=coverage/sonar-coverage.xml
